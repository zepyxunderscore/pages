<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Post — xZepyx</title>
<link rel="stylesheet" href="/theme.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⚡</text></svg>">
</head>
<body>

<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">loading<span class="loader-dots"></span></div>
</div>

<div id="cursor"></div>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-brand"><span class="nav-brand-dot"></span> xZepyx</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/blog/">Blog</a>
      <a href="/community/">Community</a>
      <a href="/admin/" id="login-btn" class="nav-admin">Login</a>
    </div>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div id="main-content">
<main class="wrap" style="padding-top:120px">
  <div id="post-container" style="max-width:760px;margin:0 auto"></div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-socials">
      <a href="https://github.com/xZepyx" target="_blank">GH</a>
      <a href="https://x.com/ZepyxUnderscore" target="_blank">X</a>
      <a href="https://reddit.com/user/ArchPowerUser" target="_blank">RD</a>
    </div>
    <div class="footer-copy">2πrh · xZepyx &copy; 2026</div>
  </div>
</footer>
</div>

<script src="/app.js"></script>
<script>
;(async () => {
  const id = new URLSearchParams(window.location.search).get('id')
  const c = document.getElementById('post-container')
  if (!id) { c.innerHTML = '<div style="text-align:center;padding:80px 0"><h2 style="font-size:1.5rem">No post specified</h2><a href="/blog/" class="btn btn-ghost" style="margin-top:20px">← Back</a></div>'; return }

  try {
    const r = await fetch('https://api.github.com/repos/xZepyx/zepyx.github.io/issues/' + id)
    if (!r.ok) throw Error()
    const post = await r.json()
    if (post.pull_request) throw Error()

    const labels = post.labels.filter(l => l.name !== 'blog').map(l => `<span class="tag">${esc(l.name)}</span>`).join('')
    const bodyHtml = renderMarkdown(post.body || '')
    const date = new Date(post.created_at).toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' })
    const upd = post.updated_at !== post.created_at ? ` · Updated ${formatDate(post.updated_at)}` : ''

    c.innerHTML = `
      <a href="/blog/" class="post-back">← Back to blog</a>
      <div class="post-header">
        <div class="post-meta">
          <span>${date}</span>${upd}
          <span>by ${esc(post.user?.login||'unknown')}</span>
          ${labels ? `<span style="display:inline-flex;gap:6px">${labels}</span>` : ''}
        </div>
        <h1 class="post-title">${esc(post.title)}</h1>
      </div>
      <div class="post-body prose">${bodyHtml}</div>
      <div class="post-footer">
        <div class="post-reactions">
          <span style="font-size:0.85rem;color:var(--txt-muted)">${post.reactions?.total_count ? Object.entries({'+1':'👍','-1':'👎','laugh':'😄','hooray':'🎉','heart':'❤️','rocket':'🚀','eyes':'👀'}).filter(([k])=>post.reactions[k]).map(([k,v])=>v+' '+post.reactions[k]).join(' ') : ''}</span>
          <a href="${post.html_url}" target="_blank" class="btn btn-ghost" style="font-size:0.75rem">Comment on GitHub →</a>
        </div>
      </div>
      ${post.comments > 0 ? `
      <div class="post-comments">
        <h3 style="font-weight:600;font-size:1rem;color:#fff;margin-bottom:20px">Comments (${post.comments})</h3>
        <p style="color:var(--txt-muted);font-size:0.85rem">Comments are on GitHub. <a href="${post.html_url}" target="_blank">View them here →</a></p>
      </div>` : `
      <div class="post-comments">
        <p style="color:var(--txt-muted);font-size:0.85rem">No comments yet. <a href="${post.html_url}" target="_blank">Be the first on GitHub →</a></p>
      </div>`}
    `
  } catch(e) {
    c.innerHTML = '<div style="text-align:center;padding:80px 0"><h2 style="font-size:1.5rem">Post not found</h2><p style="color:var(--txt-muted);margin-top:8px">It may have been removed.</p><a href="/blog/" class="btn btn-ghost" style="margin-top:20px">← Back to blog</a></div>'
  }
})()
</script>

<style>
.post-back { font-family: var(--mono); font-size: 0.8rem; color: var(--txt-muted); display: inline-block; margin-bottom: 32px; transition: var(--transition); }
.post-back:hover { color: var(--accent-1); }
.post-header { margin-bottom: 48px; }
.post-meta { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 0.75rem; color: var(--txt-muted); font-family: var(--mono); margin-bottom: 20px; }
.post-title { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 800; line-height: 1.15; color: #fff; letter-spacing: -0.03em; margin: 0; }

/* Prose */
.prose { font-size: 0.95rem; line-height: 1.85; color: var(--txt); }
.prose h1, .prose h2, .prose h3, .prose h4 { color: #fff; margin: 40px 0 16px; font-weight: 700; letter-spacing: -0.02em; }
.prose h1 { font-size: 1.8rem; } .prose h2 { font-size: 1.5rem; } .prose h3 { font-size: 1.2rem; } .prose h4 { font-size: 1rem; }
.prose p { margin-bottom: 20px; }
.prose code { font-family: var(--mono); font-size: 0.85rem; background: var(--accent-dim); padding: 2px 6px; border-radius: 4px; color: var(--accent-1); }
.prose pre { background: rgba(0,0,0,0.4); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 20px; overflow-x: auto; margin: 24px 0; }
.prose pre code { background: none; padding: 0; color: var(--txt); }
.prose img { max-width: 100%; border-radius: var(--radius-sm); margin: 24px 0; }
.prose blockquote { border-left: 3px solid var(--accent-1); padding-left: 20px; margin: 24px 0; color: var(--txt-muted); font-style: italic; }
.prose hr { border: none; border-top: 1px solid var(--line); margin: 40px 0; }
.prose ul { padding-left: 24px; margin-bottom: 20px; }
.prose li { margin-bottom: 8px; }
.prose a { color: var(--accent-1); }
.prose strong { color: #fff; }

.post-footer { margin: 48px 0; padding: 24px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.post-reactions { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.post-comments { margin-top: 40px; }
</style>
</body>
</html>
