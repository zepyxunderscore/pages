<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blog — xZepyx</title>
<link rel="stylesheet" href="/theme.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>⚡</text></svg>">
</head>
<body>

<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">loading<span class="loader-dots"></span></div>
</div>

<div id="cursor"></div>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-brand"><span class="nav-brand-dot"></span> xZepyx</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/blog/" class="active">Blog</a>
      <a href="/community/">Community</a>
      <a href="/admin/" id="admin-link" style="display:none" class="nav-admin">Admin</a>
      <a href="/admin/" id="login-btn" class="nav-admin">Login</a>
    </div>
    <button class="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</nav>

<div id="main-content">
<main class="wrap" style="padding-top:120px">
  <div class="section-tag">Blog</div>
  <div class="section-title">Posts</div>
  <div class="section-sub" style="margin-bottom:48px">Thoughts, updates, and debugging stories.</div>

  <div id="blog-list" class="blog-list"></div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-socials">
      <a href="https://github.com/xZepyx" target="_blank">GH</a>
      <a href="https://x.com/ZepyxUnderscore" target="_blank">X</a>
      <a href="https://reddit.com/user/ArchPowerUser" target="_blank">RD</a>
    </div>
    <div class="footer-copy">2πrh · xZepyx &copy; 2026</div>
  </div>
</footer>
</div>

<script src="/app.js"></script>
<script>
;(async function() {
  const c = document.getElementById('blog-list')
  try {
    const r = await fetch('https://api.github.com/repos/xZepyx/zepyx.github.io/issues?state=open&sort=created&direction=desc&labels=blog&per_page=50')
    if (!r.ok) throw Error()
    const posts = (await r.json()).filter(i => !i.pull_request)
    if (!posts.length) {
      c.innerHTML = '<div style="text-align:center;padding:80px 0"><p style="color:var(--txt-muted)">No posts yet.</p><p style="font-family:var(--mono);font-size:0.8rem;color:var(--accent-1);margin-top:8px">// TODO: write something</p></div>'
      return
    }
    c.innerHTML = '<div class="blog-grid">' + posts.map(p => {
      const ex = (p.body||'').replace(/[#*`>\[\]]/g,'').slice(0,200).trim()
      const tg = p.labels.filter(l=>l.name!=='blog').map(l=>`<span class="tag">${esc(l.name)}</span>`).join('')
      const dt = formatDate(p.created_at)
      return `<a href="/blog/post.html?id=${p.number}" class="blog-card">
        <div class="blog-card-meta"><span>${dt}</span>${p.comments?`<span>💬 ${p.comments}</span>`:''}${tg}</div>
        <h3 class="blog-card-title">${esc(p.title)}</h3>
        <p class="blog-card-excerpt">${ex}</p>
        <span class="blog-card-arrow" style="margin-top:auto">Read more →</span>
      </a>`
    }).join('') + '</div>'
  } catch {
    c.innerHTML = '<div style="text-align:center;padding:80px 0"><p style="color:var(--txt-muted)">Failed to load posts.</p></div>'
  }
})()
</script>

<style>
.blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
.blog-card {
  padding: 28px; border-radius: var(--radius); text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid rgba(255,255,255,0.04);
  transition: var(--transition); display: flex; flex-direction: column;
}
.blog-card:hover { border-color: var(--accent-1); transform: translateY(-4px); }
.blog-card-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.7rem; color: var(--txt-muted); font-family: var(--mono); margin-bottom: 16px; }
.blog-card-title { font-size: 1.1rem; font-weight: 700; color: #fff; margin: 0 0 12px; line-height: 1.3; }
.blog-card-excerpt { font-size: 0.8rem; color: var(--txt-muted); line-height: 1.6; flex-grow: 1; }
.blog-card-arrow { font-family: var(--mono); font-size: 0.8rem; color: var(--accent-1); margin-top: 16px; display: inline-block; }
</style>
</body>
</html>
