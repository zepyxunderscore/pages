 const a=[...m.values()].sort((x,y)=>y[1]-x[1]).slice(0,2000);MEM[l]=a;if(a.length>50)try{localStorage.setItem('wp'+l,JSON.stringify(a))}catch(e){}}

const lk=w=>S.m[w],pct=(a,b)=>b?a/b*100:0;

function home(){Q=null;const dueN=Object.keys(S.m).filter(due).length,Ls=Object.keys(W),T=Ls.map(words),all=T.flat(),k=all.filter(lk).length;
 shell(`<b>Wordlock</b><button onclick="settings()">⚙</button>`,`<div class="card"><div class="row"><b>${k} of ${all.length} words mastered</b><span class="m sm">${Math.round(pct(k,all.length))}%</span></div><div class="m sm">Words are drilled in spaced rounds, re-tested in a final check, then resurface for review after 1, 3, 7, 14 and 30 days. ${C.xtra?'Extra API words load per letter on first open.':'Every set is exam-core: finish them all to cover the high-yield list.'}</div><div class="bar" style="margin:0 16px 16px"><i style="width:${pct(k,all.length)}%"></i></div></div>${dueN?`<div class="card"><button class="li" onclick="review()"><span class="av">↻</span><span class="tx"><b>Spaced review</b><small>${dueN} mastered word${dueN>1?'s':''} due for a recall check</small></span><span class="m sm">START</span></button></div>`:''}
 <div class="card">${Ls.map((l,i)=>{const w=T[i],n=w.filter(lk).length,got=P(l);return`<button class="li" onclick="letter('${l}')"><span class="av ${n&&n==w.length?'dn':''}">${l.toUpperCase()}</span><span class="tx"><b>Letter ${l.toUpperCase()}</b><small>${(got||!C.xtra)?`${w.length} words · ${sets(l).length} sets · ${n} mastered`:`${w.length} curated ★ · tap to load up to ${C.cap}`}</small><span class="bar"><i style="width:${pct(n,w.length)}%"></i></span></span><span class="m">›</span></button>`}).join('')}</div>`)}

function build(w,t){const I=S.info[w],oth=Q.dp.filter(x=>x!=w).map(x=>S.info[x]);let ans,d;
 if(t=='d'){ans=cl(I.d);d=[...new Set(shuf(oth).sort((a,b)=>(b.p==I.p)-(a.p==I.p)).map(x=>cl(x.d)))].filter(x=>x!=ans).slice(0,3)}
